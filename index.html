<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/images/ridesure-favicon.png"
    />

    <!-- Responsive Design -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>RideSure | Smart Corporate Transportation Platform</title>

    <meta
      name="description"
      content="RideSure is a smart corporate transportation platform designed to make every journey safer, simpler and more reliable."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://ridesure-website.pages.dev/"
    />

    <!-- Browser / Brand -->
    <meta
      name="theme-color"
      content="#071f4b"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://ridesure-website.pages.dev/"
    />

    <meta
      property="og:title"
      content="RideSure | Smart Corporate Transportation Platform"
    />

    <meta
      property="og:description"
      content="RideSure is a smart corporate transportation platform designed to make every journey safer, simpler and more reliable."
    />

    <meta
      property="og:image"
      content="https://ridesure-website.pages.dev/images/ridesure-experience.png"
    />

    <meta
      property="og:site_name"
      content="RideSure"
    />

    <!-- Twitter / Social Sharing -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="RideSure | Smart Corporate Transportation Platform"
    />

    <meta
      name="twitter:description"
      content="RideSure is a smart corporate transportation platform designed to make every journey safer, simpler and more reliable."
    />

    <meta
      name="twitter:image"
      content="https://ridesure-website.pages.dev/images/ridesure-experience.png"
    />

    <!-- Structured Data: Website -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "RideSure",
        "url": "https://ridesure-website.pages.dev/",
        "description": "RideSure is a smart corporate transportation platform designed to make every journey safer, simpler and more reliable."
      }
    </script>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "RideSure",
        "url": "https://ridesure-website.pages.dev/",
        "logo": "https://ridesure-website.pages.dev/images/ridesure-logo.png",
        "description": "RideSure is a smart corporate transportation platform designed to make every journey safer, simpler and more reliable."
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
