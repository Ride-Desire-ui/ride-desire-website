<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Ride Desire Favicons -->
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="any"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/images/ride-desire-favicon.png"
    />

    <link
      rel="shortcut icon"
      href="/favicon.ico"
    />

    <link
      rel="apple-touch-icon"
      sizes="512x512"
      href="/images/ride-desire-favicon.png"
    />

    <!-- Responsive Design -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>Ride Desire - Corporate Transportation Platform</title>

    <meta
      name="description"
      content="Ride Desire is a smart corporate transportation platform designed to make every journey safer, simpler and more reliable."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://ride-desire-website.pages.dev/"
    />

    <!-- Browser / Brand -->
    <meta
      name="theme-color"
      content="#071f4b"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://ride-desire-website.pages.dev/"
    />

    <meta
      property="og:title"
      content="Ride Desire - Corporate Transportation Platform"
    />

    <meta
      property="og:description"
      content="Ride Desire is a smart corporate transportation platform designed to make every journey safer, simpler and more reliable."
    />

    <meta
      property="og:image"
      content="https://ride-desire-website.pages.dev/images/ride-desire-experience.png"
    />

    <meta
      property="og:site_name"
      content="Ride Desire"
    />

    <!-- Twitter / Social Sharing -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Ride Desire - Corporate Transportation Platform"
    />

    <meta
      name="twitter:description"
      content="Ride Desire is a smart corporate transportation platform designed to make every journey safer, simpler and more reliable."
    />

    <meta
      name="twitter:image"
      content="https://ride-desire-website.pages.dev/images/ride-desire-experience.png"
    />

    <!-- Structured Data: Website -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://ride-desire-website.pages.dev/#website",
        "name": "Ride Desire",
        "url": "https://ride-desire-website.pages.dev/",
        "description": "Ride Desire is a smart corporate transportation platform designed to make every journey safer, simpler and more reliable.",
        "publisher": {
          "@id": "https://ride-desire-website.pages.dev/#organization"
        }
      }
    </script>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://ride-desire-website.pages.dev/#organization",
        "name": "Ride Desire",
        "url": "https://ride-desire-website.pages.dev/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://ride-desire-website.pages.dev/images/ride-desire-logo.png"
        },
        "description": "Ride Desire is a smart corporate transportation platform designed to make every journey safer, simpler and more reliable."
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
